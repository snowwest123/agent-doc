services:
  api:
    build:
      context: .
      target: api
    container_name: myrag-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      # Redis 连接（容器间用服务名 redis）
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      # 持久化上传文件 + FAISS 索引
      - myrag_data:/app/data
    depends_on:
      - redis
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: myrag-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    build:
      context: .
      target: frontend-runtime
    container_name: myrag-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  myrag_data:
  redis_data:
